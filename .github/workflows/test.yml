name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions: {}

jobs:
  super-lint:
    permissions: { contents: read, packages: read, statuses: write }
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USE_FIND_ALGORITHM: true # support detached-head checkouts
          VALIDATE_GIT_COMMITLINT: false # commitlint is bad
